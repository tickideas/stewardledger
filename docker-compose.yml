name: stewardledger

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: stewardledger
      POSTGRES_PASSWORD: stewardledger
      POSTGRES_DB: stewardledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stewardledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: stewardledger
      POSTGRES_PASSWORD: stewardledger
      POSTGRES_DB: stewardledger_test
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stewardledger -d stewardledger_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pgdata_test:
